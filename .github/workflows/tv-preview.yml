name: TV page preview

# Puts the TV page (website/tv/) on GitHub Pages so it can be opened in a TV's own browser for testing:
# https://mfvision.github.io/mosque-pro/ (the root opens the TV page). Only the TV page and the few files it uses are
# published, not the rest of the website. Needs Settings > Pages > Source: GitHub Actions, once.
on:
  push:
    branches: [main]
    paths: ["website/tv/**", "website/prayer.js", "website/places.js", "website/sky.js", ".github/workflows/tv-preview.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tv-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Gather the TV page and what it loads
        run: |
          mkdir -p _site/assets
          cp -R website/tv _site/tv
          cp website/prayer.js website/places.js website/sky.js _site/
          cp website/assets/zones.json website/assets/adhan.mp3 website/assets/icon-180.png _site/assets/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=tv/"><title>Mosque Pro TV</title><a href="tv/">Mosque Pro TV</a>\n' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
