name: TV page preview

# Puts Mosque Pro's site on GitHub Pages, https://mfvision.github.io/mosque-pro/: the home page, the privacy policy and
# terms, and the TV page for a TV's own browser (tools/site_bundle.py; the same folder is nearmosque.net/mosque-pro/,
# where the apps link). Only these and the few files they use are published. Needs Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["website/tv/**", "website/prayer.js", "website/places.js", "website/sky.js", "website/home.html", "website/privacy.html",
            "website/terms.html", "website/legal.*", "tools/site_bundle.py", ".github/workflows/tv-preview.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tv-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Gather the site, the TV page and what they load
        run: python3 tools/site_bundle.py _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
