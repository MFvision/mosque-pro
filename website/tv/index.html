<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mosque Pro · TV</title>
<link rel="icon" href="../assets/icon-180.png">
<link rel="stylesheet" href="tv.css">
</head>
<body>
<canvas class="sky" aria-hidden="true"></canvas>

<main id="board" class="screen">
  <header class="top">
    <div>
      <p id="city" class="city"></p>
      <p id="date" class="date"></p>
      <p id="hijri" class="hijri"></p>
    </div>
    <p id="clock" class="clock"></p>
  </header>
  <section class="next" aria-live="off">
    <p id="next-label" class="label"></p>
    <p class="next-line"><span id="next-name" class="next-name"></span><span id="next-at" class="next-at"></span></p>
    <p id="countdown" class="countdown"></p>
  </section>
  <section id="daily" class="daily">
    <p id="daily-label" class="label gold"></p>
    <p id="daily-ar" class="daily-ar" lang="ar" dir="rtl"></p>
    <p id="daily-tr" class="daily-tr"></p>
    <p id="daily-ref" class="daily-ref"></p>
  </section>
  <ol id="times" class="times"></ol>
</main>

<main id="adhan" class="screen adhan" hidden>
  <p id="adhan-label" class="label"></p>
  <p id="adhan-name" class="adhan-name"></p>
  <p class="takbir" lang="ar" dir="rtl">اللّٰهُ أَكْبَرُ، اللّٰهُ أَكْبَرُ</p>
  <p class="iqama"><span id="iqama-label"></span><b id="iqama-in"></b></p>
</main>

<main id="night" class="screen night" hidden>
  <div id="night-box" class="night-box">
    <p id="night-clock" class="night-clock"></p>
    <p id="night-next" class="night-next"></p>
  </div>
</main>

<dialog id="settings" class="settings">
  <h2 id="s-title"></h2>
  <div class="row"><span id="s-city-l"></span><button id="s-city-prev" type="button" aria-label="‹">‹</button><b id="s-city"></b><button id="s-city-next" type="button" aria-label="›">›</button></div>
  <div class="row"><span id="s-lang-l"></span><button id="s-lang" type="button"></button></div>
  <div class="row"><span id="s-sound-l"></span><button id="s-sound" type="button"></button></div>
  <div class="row"><span id="s-night-l"></span><button id="s-night" type="button"></button></div>
  <p id="s-hint" class="hint"></p>
  <button id="s-close" type="button" class="close"></button>
</dialog>

<p id="tip" class="tip"></p>
<audio id="adhan-audio" src="../assets/adhan.mp3" preload="none"></audio>

<script src="../sky.js"></script>
<script type="module" src="tv.js"></script>
</body>
</html>
